
name: Android CI
on: [push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Unzip project
        run: |
          unzip -o "nilearn-android (2).zip" || unzip -o *.zip
          ls -la nilearn-android
      - name: Build APK
        run: |
          cd nilearn-android
          gradle assembleDebug --no-daemon
      - name: Make Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Nilearn Gold v1.0
          files: nilearn-android/app/build/outputs/apk/debug/app-debug.apk