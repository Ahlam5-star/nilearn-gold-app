name: Android CI
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o "nilearn-android (2).zip"
          ls -R | head -n 100
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          GRADLE_FILE=$(find . -name "gradlew" | head -n 1)
          echo "Found gradlew at: $GRADLE_FILE"
          if [ -n "$GRADLE_FILE" ]; then
            DIR=$(dirname "$GRADLE_FILE")
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "No gradlew, trying system gradle"
            ls -la
            find . -name "settings.gradle*" -o -name "build.gradle*" | head -n 20
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nilearn-Gold-APK
          path: "**/app-debug.apk"
